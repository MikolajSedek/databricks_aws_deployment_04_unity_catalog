name: Terraform Validate & Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Terraform working directory'
        type: string
        required: false
        default: 'environments/dev'
      environment:
        description: 'Target environment name'
        type: string
        required: false
        default: 'dev'
      terraform_version:
        description: 'Terraform version'
        type: string
        required: false
        default: '1.16.3'
      aws_region:
        description: 'AWS region'
        type: string
        required: false
        default: 'eu-central-1'
      aws_profile:
        description: 'AWS profile name'
        type: string
        required: false
        default: 'production-admin'
      plan_artifact_name:
        description: 'Terraform plan artifact name'
        type: string
        required: false
        default: 'dev-tfplan'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      TF_VERSION: ${{ inputs.terraform_version }}
      AWS_REGION: ${{ secrets.AWS_REGION || inputs.aws_region }}
      AWS_PROFILE: ${{ inputs.aws_profile }}
      AWS_SDK_LOAD_CONFIG: '1'
      TF_WORKING_DIR: ${{ inputs.working_directory }}
      # Terraform variables - AWS & environment
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || inputs.aws_region }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_profile: ${{ inputs.aws_profile }}
      # Terraform variables - Databricks MWS & Unity Catalog governance authentication
      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_service_principal_id: ${{ secrets.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_SERVICE_PRINCIPAL_ID }}
      TF_VAR_service_principal_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET || secrets.DATABRICKS_SERVICE_PRINCIPAL_SECRET }}
      # Databricks provider environment variables
      DATABRICKS_HOST: 'https://accounts.cloud.databricks.com'
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_SERVICE_PRINCIPAL_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET || secrets.DATABRICKS_SERVICE_PRINCIPAL_SECRET }}
      SKIP: 'terraform_docs'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Setup Terraform using official HashiCorp GitHub plugin
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Configure AWS Credentials and write shared profile via action
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-profile: ${{ env.AWS_PROFILE }}
          overwrite-aws-profile: true
          role-to-assume: ${{ secrets.AWS_PROFILE_ROLE_ARN }}
          role-skip-session-tagging: true

      # Cache Terraform plugins and providers (.terraform directory)
      - name: Cache Terraform Providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', env.TF_WORKING_DIR)) }}
          restore-keys: |
            terraform-${{ runner.os }}-

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate -no-color

      # Speculative Execution Plan
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      # Upload and cache the binary plan file and text summary
      - name: Cache & Save Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/tfplan.txt
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          retention-days: 5

      # Attach plan summary to Job Summary
      - name: Add Plan Summary to Job Summary
        run: |
          echo "### Terraform Plan Summary (\`${{ inputs.environment }}\`)" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat tfplan.txt | tail -n 50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
